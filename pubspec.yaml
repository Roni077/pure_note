name: pure_note
description: "Your Notes. Your Device. Your Privacy. A 100% offline, privacy-first Flutter notes app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.2
  path: ^1.9.0
  freezed_annotation: ^2.4.1
  go_router: ^13.2.0
  intl: ^0.20.2
  uuid: ^4.3.3
  flutter_quill: ^9.3.21
  file_picker: ^8.0.0
  share_plus: ^8.0.1
  archive: ^3.4.10
  cupertino_icons: ^1.0.8
  json_annotation: ^4.9.0
  local_auth: ^3.0.2
  shared_preferences: ^2.5.5
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  drift_dev: ^2.16.0
  freezed: ^2.4.7
  mockito: ^5.4.4
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

dependency_overrides:
  intl: ^0.20.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#121212"
  android: true
  ios: false
